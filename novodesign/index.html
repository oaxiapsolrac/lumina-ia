<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem maximum-scale/user-scalable=no: bloquear o zoom impede quem precisa ampliar o texto (WCAG 1.4.4) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Lumina, assistente do Projeto ELLAS sobre igualdade de gênero em STEM na América Latina." />
    <meta name="theme-color" content="#0e0e11" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet" />
    <title>Lumina • Projeto ELLAS</title>
    <script>
      // Aplica o tema salvo antes de o React carregar, para não piscar a tela clara/escura
      (function () {
        try {
          var t = localStorage.getItem('lumina_tema') || 'sistema';
          var escuro = t === 'escuro' || (t === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = escuro ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <noscript>A Lumina precisa de JavaScript habilitado para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
